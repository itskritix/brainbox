name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize runs per ref. PR runs cancel superseded builds for fast feedback;
# main runs never cancel (protects an in-flight production deploy).
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    # Postgres for the backend integration tests. Matches the suite's default
    # test env (backend/test/env.ts): brainbox:brainbox@localhost:5432. The
    # superuser `brainbox` can CREATE DATABASE, so global-setup makes brainbox_test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brainbox
          POSTGRES_PASSWORD: brainbox
          POSTGRES_DB: brainbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brainbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same gate agents must pass locally: lint → typecheck → test → build.
      - run: pnpm verify

  # --- CD: only on push to main, after verify. Fully automatic. ---

  deploy-box:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never let two production deploys overlap.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Load the dedicated CI SSH key into the agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
      - name: Deploy backend + dashboard + widget (runs scripts/deploy.sh on the box)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${EC2_USER}@${EC2_HOST}" \
            "cd /home/ubuntu/brainbox && git fetch origin --quiet && git show ${GITHUB_SHA}:scripts/deploy.sh | bash -s -- ${GITHUB_SHA}"

  # Marketing (brainbox-marketing) deploys through the Vercel CLI rather than
  # Vercel's git integration. The integration attributes each deployment to the
  # *commit author* and blocks anyone who isn't a project member — and our merge
  # commits are authored by GitHub's noreply address, not the account that owns
  # the Vercel project, so every push to main failed with "Git author itskritix
  # must have access to the project". A token deploy authenticates as the token
  # owner instead, so there is no per-author check to fail.
  #
  # Turn OFF the Vercel git integration for this project once the secrets are in
  # place, or every push deploys twice.
  deploy-marketing:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-marketing
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Harmless to merge before the secrets exist: without a token the job
      # reports what's missing and exits clean rather than failing main.
      - name: Skip (VERCEL_TOKEN not set)
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "::notice::VERCEL_TOKEN not set — skipping marketing deploy."
          echo "Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID to repo secrets to enable it."
      - name: Deploy marketing to Vercel production
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
