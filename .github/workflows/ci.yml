name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize runs per ref. PR runs cancel superseded builds for fast feedback;
# main runs never cancel (protects an in-flight production deploy).
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    # Postgres for the backend integration tests. Matches the suite's default
    # test env (backend/test/env.ts): brainbox:brainbox@localhost:5432. The
    # superuser `brainbox` can CREATE DATABASE, so global-setup makes brainbox_test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brainbox
          POSTGRES_PASSWORD: brainbox
          POSTGRES_DB: brainbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brainbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same gate agents must pass locally: lint → typecheck → test → build.
      - run: pnpm verify

  # --- CD: only on push to main, after verify. Fully automatic. ---

  deploy-box:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never let two production deploys overlap.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Load the dedicated CI SSH key into the agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
      - name: Deploy backend + dashboard + widget + marketing (runs scripts/deploy.sh on the box)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${EC2_USER}@${EC2_HOST}" \
            "cd /home/ubuntu/brainbox && git fetch origin --quiet && git show ${GITHUB_SHA}:scripts/deploy.sh | bash -s -- ${GITHUB_SHA}"
